  - name: hrr_dashboards
    pipeline_name: pl_oracle_fusion_bip_fullload
    dataset_parameters:
      table_name: 'HRR_DASHBOARDS'
      from_date: '2022-01-01'
  - name: hrr_meetings
    pipeline_name: pl_oracle_fusion_bip_fullload
    dataset_parameters:
      table_name: 'HRR_MEETINGS'
      from_date: '2022-01-01'
  - name: hrt_rating_levels_vl
