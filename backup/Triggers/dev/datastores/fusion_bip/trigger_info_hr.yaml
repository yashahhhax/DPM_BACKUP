pipeline_name: pl_oracle_fusion_bip_incremental

schedule:
  frequency: Day
  interval: 1
  hours: [04]
  minutes: [30]

activated: true

datastore_parameters:
  datastore_name: 'fusion_bip_hr'
  user_name: 'biacm.admin'
  secret_name: 'cloud-fusion-bip-svc-prd-password'
  base_url: 'https://enpk.fa.em8.oraclecloud.com:443/xmlpserver/services/v2/ReportService'
  source_path: '/Custom/Data_Team/Fusion_AZ_Extract_HCM_DE/'
  workflow_name: 'wf_ingest_fusion_bip_fusion'
  load_time_column_type: timestamp
  use_case: 'hr'
  # full_load: true
  # skip_orchestration: true

datasets:
  - name: per_users
    pipeline_name: pl_oracle_fusion_bip_fullload
    dataset_parameters:
      table_name: 'PER_USERS'
  - name: hrm_plan_incumbents
    pipeline_name: pl_oracle_fusion_bip_fullload
    dataset_parameters:
      table_name: 'HRM_PLAN_INCUMBENTS'
  - name: job_criticality
    pipeline_name: pl_oracle_fusion_bip_fullload
    dataset_parameters:
      table_name: 'JOB_CRITICALITY'
  - name: fun_all_business_units_v
    pipeline_name: pl_oracle_fusion_bip_fullload
    dataset_parameters:
      table_name: 'FUN_ALL_BUSINESS_UNITS_V'
      from_date: '2022-01-01'
  - name: per_periods_of_service
    pipeline_name: pl_oracle_fusion_bip_fullload
    dataset_parameters:
      table_name: 'PER_PERIODS_OF_SERVICE'
      from_date: '2022-01-01'
  - name: per_people_legislative_f
    pipeline_name: pl_oracle_fusion_bip_fullload
    dataset_parameters:
      table_name: 'PER_PEOPLE_LEGISLATIVE_F'
      from_date: '2022-01-01'
  - name: per_citizenships
    pipeline_name: pl_oracle_fusion_bip_fullload
    dataset_parameters:
      table_name: 'PER_CITIZENSHIPS'
      from_date: '2022-01-01'
  - name: hr_lookups
    pipeline_name: pl_oracle_fusion_bip_fullload
