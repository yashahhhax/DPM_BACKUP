pipeline_name: pl_azure_sql_to_parquet_incremental

schedule:
  frequency: Day
  interval: 1
  hours: [4]
  minutes: [30]

activated: false

datastore_parameters:
  datastore_name: 'scv'
  server_name: 'fe-prod-cdm-scvprimary.database.windows.net'
  user_name: 'feprodcdmscvadmin'
  secret_name: 'cloud-scv-sqlserver-sql-svc-prd-password'
  database_name: 'fe-prod-cdm-scv-db'
  # skip_orchestration: true

datasets:
  - name: mdm_f_communication_preference
    dataset_parameters:
      schema_name: 'dwh'
      table_name: 'MDM_F_COMMUNICATION_PREFERENCE'
      pk: 'F_Comm_Pref_Key'
      load_time_column: 'Modified_Date'
      use_case: 'scv_mdm, customer360'
