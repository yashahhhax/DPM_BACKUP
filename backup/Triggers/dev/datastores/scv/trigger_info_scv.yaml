pipeline_name: pl_azure_sql_to_parquet_fullload

schedule:
  frequency: Day
  interval: 1
  hours: [06]
  minutes: [00]

activated: false

datastore_parameters:
  datastore_name: 'scv'
  server_name: 'fe-prod-cdm-scvprimary.database.windows.net'
  user_name: 'feprodcdmscvadmin'
  secret_name: 'cloud-scv-sqlserver-sql-svc-prd-password'
  database_name: 'fe-prod-cdm-scv-db'
  schema_name: 'dbo'
  use_case: 'scv'
  # skip_orchestration: true

datasets:
  - name: scv_guest_view_v1
    dataset_parameters:
      schema_name: 'rpt'
      table_name: 'scv_guest_view_v1'
      use_case: 'scv, emersys, ipera'
  - name: contactless_enrollment
    dataset_parameters:
      table_name: 'contactless_enrollment'
      use_case: 'scv, facepassreporting'
