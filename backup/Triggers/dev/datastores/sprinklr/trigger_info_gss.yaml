pipeline_name: pl_social_media_to_parquet

schedule:
  frequency: Day
  interval: 1
  hours: [04]
  minutes: [00]

activated: false

datastore_parameters:
  base_url: 'https://api2.sprinklr.com/'
  secret_name: 'cloud-sprinklr-api-prd-json-apikey'
  datastore_name: 'sprinklr'           
  schema_name: 'gss'
  use_case: 'gss_socialmedia'
  # skip_orchestration: true

datasets:
  - name: social_media
    dataset_parameters:
      table_name: 'social_media'
      workflow_name: 'wf_ingest_gss_social_media'
      start_date: "@string(formatDateTime(addDays(convertTimeZone(utcNow(),'UTC','Arabian Standard Time'),-15),'yyyy-MM-dd'))"
      end_date: "@string(formatDateTime(addDays(convertTimeZone(utcNow(),'UTC','Arabian Standard Time'),-1),'yyyy-MM-dd'))"
  - name: sm_star_ratings
    dataset_parameters:
      table_name: 'sm_star_ratings'
      workflow_name: 'wf_ingest_gss_sm_star_ratings'
      start_date: "@string(formatDateTime(addDays(convertTimeZone(utcNow(),'UTC','Arabian Standard Time'),-15),'yyyy-MM-dd'))"
      end_date: "@string(formatDateTime(addDays(convertTimeZone(utcNow(),'UTC','Arabian Standard Time'),-1),'yyyy-MM-dd'))"
  - name: sm_star_ratings_w_sentiments
    dataset_parameters:
      table_name: 'sm_star_ratings_w_sentiments'
      workflow_name: 'wf_ingest_gss_sm_star_ratings_w_sentiments'
      start_date: "@string(formatDateTime(addDays(convertTimeZone(utcNow(),'UTC','Arabian Standard Time'),-15),'yyyy-MM-dd'))"
      end_date: "@string(formatDateTime(addDays(convertTimeZone(utcNow(),'UTC','Arabian Standard Time'),-1),'yyyy-MM-dd'))"
  - name: sm_topic_analysis
    dataset_parameters:
      table_name: 'sm_topic_analysis'
      workflow_name: 'wf_ingest_gss_sm_topic_analysis'
      start_date: "@string(formatDateTime(addDays(convertTimeZone(utcNow(),'UTC','Arabian Standard Time'),-15),'yyyy-MM-dd'))"
      end_date: "@string(formatDateTime(addDays(convertTimeZone(utcNow(),'UTC','Arabian Standard Time'),-1),'yyyy-MM-dd'))"
