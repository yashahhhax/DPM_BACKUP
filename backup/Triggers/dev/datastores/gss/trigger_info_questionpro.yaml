pipeline_name: pl_question_pro_to_parquet_master
 
schedule:
  frequency: Day
  interval: 1
  hours: [04]
  minutes: [00]
 
activated: false
 
datastore_parameters:
  datastore_name: 'questionpro'          
  table_name: 'survey_response'
  workflow_name: 'wf_ingest_gss_question_pro'
  base_url: 'https://api.questionpro.ae/a/api/v2/cx/responses'
  from_date: "@string(formatDateTime(addDays(convertTimeZone(utcNow(),'UTC','Arabian Standard Time'),-15),'yyyy-MM-dd'))"
  to_date: "@string(formatDateTime(addDays(convertTimeZone(utcNow(),'UTC','Arabian Standard Time'),-1),'yyyy-MM-dd'))"
  use_case: 'gss'
   # skip_orchestration: true

datasets:
  - name: ak3_survey_response
    dataset_parameters:
      schema_name: 'gss_ak3'
      secret_name: 'cloud-questionpro-ak3-api-prd-apikey'
  - name: ak4_survey_response
    dataset_parameters:
      schema_name: 'gss_ak4'
      secret_name: 'cloud-questionpro-ak4-api-prd-apikey'
  - name: ak5_survey_response
    dataset_parameters:
      schema_name: 'gss_ak5'
      secret_name: 'cloud-questionpro-ak5-api-prd-apikey'
  - name: ak6_survey_response
    dataset_parameters:
      schema_name: 'gss_ak6'
      secret_name: 'cloud-questionpro-ak6-api-prd-apikey'
  - name: ak7_survey_response
    dataset_parameters:
      schema_name: 'gss_ak7'
      secret_name: 'cloud-questionpro-ak7-api-prd-apikey'
