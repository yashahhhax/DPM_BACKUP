pipeline_name: pl_ycautomation_genesys_voice
 
schedule:
  frequency: Month
  interval: 1
  monthDays: [10]
  hours: [10]
  minutes: [00]

activated: false
 
datastore_parameters:
  datastore_name: 'genesys'          
  dataset_name: 'ycautomation'
  workflow_name: 'wf_ingest_ycautomation_genesys_voice'
  secret_name: "cloud-genesys-api-prd-apikey"
  start_date: "@formatDateTime(startOfMonth(addDays(startOfMonth(convertTimeZone(utcNow(),'UTC','Arabian Standard Time')),-1)),'yyyy-MM-dd')"
  end_date: "@formatDateTime(addDays(startOfMonth(convertTimeZone(utcNow(),'UTC','Arabian Standard Time')),-1),'yyyy-MM-dd')"
  use_case: 'ycautomation'
  # skip_orchestration: true

datasets:
  - name: genesys_voice_call_details_flattened
    dataset_parameters:
      table_name: 'genesys_voice_call_details_flattened'
