pipeline_name: pl_sharepoint_excel_to_parquet

schedule:
  frequency: Month
  interval: 1
  monthDays: [10]
  hours: [10]
  minutes: [00]

activated: false

datastore_parameters:          
  secret_name: 'cloud-sharepoint-svc-prd-password'
  tenant_id: '0b0b76ba-8e32-4c41-8130-65ed5ca4353c'
  user_name: '23548861-9379-4ee8-9b2f-680f630b2020'
  datastore_name: 'sharepoint_file'
  schema_name: 'ycautomation'
  site: 'VOGTeam'
  use_case: 'ycautomation'
  first_row_header: 'true'
  # skip_orchestration: true

datasets:
  - name: active_employee_list
    dataset_parameters:
      path: 'VOGTeam/Shared Documents/Reports and WFM/YC Incentives Automation/Mapping Files/'
      table_name: 'active_employee_list'
      input_file_name: "@concat('Active_Employee_List_',formatDateTime(addDays(startOfMonth(convertTimeZone(utcNow(),'UTC','Arabian Standard Time')),-1),'yyyyMMdd'),'.xlsx')"
      sheet_name: 'active_list'
  - name: manual_updates
    dataset_parameters:
      path: 'VOGTeam/Shared Documents/Reports and WFM/YC Incentives Automation/Manual Updates/'
      table_name: 'manual_updates'
      input_file_name: "@concat('Manual_Updates_',formatDateTime(addDays(startOfMonth(convertTimeZone(utcNow(),'UTC','Arabian Standard Time')),-1),'yyyyMMdd'),'.xlsx')"
      sheet_name: 'csat_score'
  - name: mirza_transactions_f1
    dataset_parameters:
      path: 'VOGTeam/Shared Documents/Reports and WFM/YC Incentives Automation/Mirza Revenue Report/'
      table_name: 'mirza_transactions_f1'
      input_file_name: "@concat('Mirza_Transactions_',formatDateTime(addDays(startOfMonth(convertTimeZone(utcNow(),'UTC','Arabian Standard Time')),-1),'yyyyMMdd'),'.xlsx')"
