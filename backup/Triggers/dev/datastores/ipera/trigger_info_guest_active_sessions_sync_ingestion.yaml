pipeline_name: pl_ipera_guest_active_sessions_sync_ingestion

schedule:
    frequency: Day
    interval: 1
    hours: [21]
    minutes: [00]

activated: false

datastore_parameters:
  base_url: 'https://api.iperawifi.com/api/v1/'
  datastore_name: 'ipera'
  dataset_name: 'guest_active_sessions'
  relative_url: 'locations-analytics/active-sessions'
  workflow_name: 'wf_ingest_ipera_api_to_parquet_every_minute'
  use_case: 'ipera'
  # skip_orchestration: true

datasets:
  - name: swad_active_sessions
    dataset_parameters:
      table_name: 'swad'
      secret_name: 'cloud-iperawifi-api-prd-activesessions-apikey'
