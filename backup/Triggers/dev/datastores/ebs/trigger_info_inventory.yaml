      table_name: 'MTL_ITEM_LOCATIONS'
  - name: mtl_item_sub_inventories
    dataset_parameters:
      schema_name: 'INV'
      table_name: 'MTL_ITEM_SUB_INVENTORIES'
  - name: mtl_material_transactions
