pipeline_name: pl_oracle_to_parquet_fullload

schedule:
  frequency: Day
  interval: 1
  hours: [03]

activated: false

datastore_parameters:
  datastore_name: 'ebs'
  server_name: '10.19.10.5'
  service_name: 'ERPPROD'
  user_name: 'XXAPPS_RO'
  secret_name: 'onprem-ebs-oracle-svc-prd-password'
  port: '1531'
  use_case: 'inventory'
  # skip_orchestration: true

datasets:
  - name: ap_suppliers
    dataset_parameters:
      schema_name: 'AP'
      table_name: 'AP_SUPPLIERS'
  - name: cst_item_costs
    dataset_parameters:
      schema_name: 'BOM'
      table_name: 'CST_ITEM_COSTS'
  - name: mtl_categories_b
    dataset_parameters:
      schema_name: 'INV'
      table_name: 'MTL_CATEGORIES_B'
  - name: mtl_category_sets_b
    dataset_parameters:
      schema_name: 'INV'
      table_name: 'MTL_CATEGORY_SETS_B'
  - name: mtl_item_categories
    dataset_parameters:
      schema_name: 'INV'
      table_name: 'MTL_ITEM_CATEGORIES'
  - name: mtl_item_locations
    dataset_parameters:
