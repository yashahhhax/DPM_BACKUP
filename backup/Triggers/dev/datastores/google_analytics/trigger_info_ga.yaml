pipeline_name: pl_google_analytics_to_parquet_master

schedule:
  frequency: Day
  interval: 1
  hours: [05]
  minutes: [00]

activated: false

datastore_parameters:
  datastore_name: 'google_analytics'           
  secret_name: 'cloud-ga4-api-prd-apikey'
  jwt_workflow_name: 'wf_get_ga_jwt_token'
  workflow_name: 'wf_ingest_google_analytics'
  base_url: 'https://analyticsdata.googleapis.com/v1beta/properties/'
  from_date: "@string(formatDateTime(addDays(convertTimeZone(utcNow(),'UTC','Arabian Standard Time'),-15),'yyyy-MM-dd'))"
  to_date: "@string(formatDateTime(addDays(convertTimeZone(utcNow(),'UTC','Arabian Standard Time'),-1),'yyyy-MM-dd'))"
  use_case: 'google_analytics'

# Note - schema_name contains the value of property_id  # skip_orchestration: true

