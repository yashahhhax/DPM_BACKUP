pipeline_name: pl_dataverse_to_parquet_fullload

schedule:
  frequency: Day
  interval: 1
  hours: [08]
  minutes: [30]
  
activated: false

datastore_parameters:
  datastore_name: 'crm'
  server_name: 'https://yascrm.crm4.dynamics.com/'
  service_principal_id: 'fe2bd515-1f89-4b93-87eb-bd5f2832ea3c'
  secret_name: 'cloud-crm-api-prd-apikey'
  use_case: 'ea_drr'
  # skip_orchestration: true

datasets:
  - name: dot_country
    dataset_parameters:
      table_name: 'dot_country'
  - name: dot_region
    dataset_parameters:
      table_name: 'dot_region'
  - name: dot_segment
    dataset_parameters:
      table_name: 'dot_segment'
  - name: account
    dataset_parameters:
      table_name: 'account'
  - name: fe_omnidmgcategory
    dataset_parameters:
      table_name: 'fe_omnidmgcategory'
  - name: systemuser
    dataset_parameters:
      table_name: 'systemuser'
  - name: contact
    pipeline_name: pl_dataverse_to_parquet_incremental
    dataset_parameters:
      table_name: 'contact'
      schema_name: 'crm'
      pk: 'contactid'
      load_time_column: 'modifiedon'
      replace_string: '<<modifiedon>>'
  - name: yc_accountmanagerhistory
    dataset_parameters:
      table_name: 'yc_accountmanagerhistory'
  - name: dot_accountbusinessunitprofile
    dataset_parameters:
      table_name: 'dot_accountbusinessunitprofile'
