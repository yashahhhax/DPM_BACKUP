pipeline_name: pl_dataverse_to_parquet_fullload

schedule:
  frequency: Day
  interval: 1
  hours: [00]
  minutes: [30]

activated: false

datastore_parameters:
  datastore_name: 'crm'
  server_name: 'https://yascrm.crm4.dynamics.com/'
  service_principal_id: 'fe2bd515-1f89-4b93-87eb-bd5f2832ea3c'
  secret_name: 'cloud-crm-api-prd-apikey'
  use_case: 'customer360'
  # skip_orchestration: true

datasets:
  - name: businessunit
    dataset_parameters:
      table_name: 'businessunit'
  - name: incident
    dataset_parameters:
      table_name: 'incident'
  - name: dot_clientcontract
    dataset_parameters:
      table_name: 'dot_clientcontract'
  - name: stringmap
    dataset_parameters:
      table_name: 'stringmap'
  - name: flpm_webrequest
    dataset_parameters:
      table_name: 'flpm_webrequest'
