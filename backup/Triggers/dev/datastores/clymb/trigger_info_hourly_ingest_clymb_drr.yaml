pipeline_name: pl_mariadb_to_parquet_fullload

schedule:
    frequency: Day
    interval: 1
    hours: [01]
    minutes: [30]

activated: false

datastore_parameters:
  datastore_name: 'clymb'
  server_name: 'clymb622.datawarehouse.tunn3l.net'
  database_name: 'dwh_clymb'
  user_name: 'clymb'
  secret_name: 'cloud-clymb-mariadb-svc-prd-password'
  use_case: 'clymb_drr'
  # skip_orchestration: true

datasets:
  - name: activity_bookings
    dataset_parameters:
      table_name: 'activity_bookings'
  - name: activity_vouchers
    dataset_parameters:
      table_name: 'activity_vouchers'
  - name: bookings
    dataset_parameters:
      table_name: 'bookings'
  - name: proflyer_packs
    dataset_parameters:
      table_name: 'proflyer_packs'
  - name: vouchers
    dataset_parameters:
      table_name: 'vouchers'
