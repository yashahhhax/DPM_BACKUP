tables:
#-----------------------omni_account_master----------------------
  - name: omni_account_master
    checks:
      - criticality: error
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: omni_account_sk
      - criticality: error
        check:
            function: is_not_null_and_not_empty
            arguments:
              column: account_id
      - criticality: error
        check:
          function: is_in_list
          arguments:
            column: source_name
            allowed:
              - "'dwh_lkp_vw_account'"
      - criticality: error
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: etl_created_datetime
      - criticality: error
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: etl_updated_datetime
#--------------------------End-------------------------------------
