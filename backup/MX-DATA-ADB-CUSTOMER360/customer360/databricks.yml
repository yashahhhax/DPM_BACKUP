# Databricks Asset Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "customer360"

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

# the current_user requires Service Principal User on the run_as_sp
# see https://learn.microsoft.com/en-us/azure/databricks/security/auth/access-control/service-principal-acl#grant-roles-on-a-service-principal

permissions:
  - group_name: ${var.can_view_group}
    level: CAN_VIEW
  - group_name: ${var.can_manage_group}
    level: CAN_MANAGE    
  - service_principal_name: ${workspace.current_user.userName}
    level: CAN_MANAGE

include:
  - workflows/*.yml

variables:
  service_principal_name:
    description: service_principle
    default: 0b2873d0-ff7e-4521-9afb-159983ed213e

  environment:
    description: Environment
    default: dev
    type: string

  can_view_group:
    description: Group which can view the job
    default: dp_workflow_nonprd

  can_manage_run_group:
    description: Group which can run the job
    default: dp_workflow_manage_run_nonprd

  can_manage_group:
    description: Group which can run the job
    default: dp_workflow_manage_nonprd

  databricks_secret_scope:
    description: Databricks secret scope used to connect with snowflake
    default: kv-mx-data-adf-inges-dev
    type: string
    
  powerbi_refresh_azure_key_vault:
    description: Azure key vault name used for Power BI refresh
    default: kv-mx-data-adf-inges-dev
    type: string
  
  powerbi_refresh_client_id:
    description: Client id used for Power BI refresh
    default: f17474d3-0383-4eae-a8f0-ec459ae8009e
    type: string
        
  powerbi_refresh_secret_name:
    description: Secret name used for Power BI refresh
    default: sp-mx-data-power-bi-service-principal-client-secret
    type: string

  powerbi_refresh_tenant_name:
    description: Tenant Id that Power BI refresh datasets are created
    default: 0b0b76ba-8e32-4c41-8130-65ed5ca4353c
    type: string
    
  powerbi_refresh_modules:
    description: To filter which module datasets in a use case to refresh in powerbi
    default: ""
    type: string

  subscription:
    description: Azure subscription id
    default: 312989A6-AD5B-42B5-B553-4BB71EA31DF6
    type: string
  
  master_wf_pause_status:
    description: paused or unpaused of master email summary workflow 
    default: PAUSED

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-485279261696768.8.azuredatabricks.net
    variables:
      environment: ${bundle.target}
      subscription: 312989A6-AD5B-42B5-B553-4BB71EA31DF6
      databricks_secret_scope: kv-mx-data-adf-inges-dev
      powerbi_refresh_azure_key_vault: kv-mx-data-adf-inges-dev
      powerbi_refresh_client_id: f17474d3-0383-4eae-a8f0-ec459ae8009e 
      powerbi_refresh_secret_name: sp-mx-data-power-bi-service-principal-client-secret
      powerbi_refresh_tenant_name: 0b0b76ba-8e32-4c41-8130-65ed5ca4353c
      powerbi_refresh_modules: ""
      service_principal_name: 0b2873d0-ff7e-4521-9afb-159983ed213e
      master_wf_pause_status: PAUSED
    run_as:
      service_principal_name: 0b2873d0-ff7e-4521-9afb-159983ed213e

  uat:
    mode: production
    workspace:
      host: https://adb-125701397626662.2.azuredatabricks.net
    variables:
      environment: ${bundle.target}
      subscription: 312989A6-AD5B-42B5-B553-4BB71EA31DF6
      databricks_secret_scope: kv-mx-data-adf-inges-uat
      powerbi_refresh_azure_key_vault: kv-mx-data-adf-inges-uat
      powerbi_refresh_client_id: f17474d3-0383-4eae-a8f0-ec459ae8009e 
      powerbi_refresh_secret_name: sp-mx-data-power-bi-service-principal-client-secret
      powerbi_refresh_tenant_name: 0b0b76ba-8e32-4c41-8130-65ed5ca4353c
      powerbi_refresh_modules: ""
      service_principal_name: b09074c2-d6b5-466f-b5a5-f0b931b04d0b
      master_wf_pause_status: PAUSED
    run_as:
      service_principal_name: b09074c2-d6b5-466f-b5a5-f0b931b04d0b


  preprd:
    mode: production
    workspace:
      host: https://adb-635866415826582.2.azuredatabricks.net/
    variables:
      environment: ${bundle.target}
      can_view_group: dp_workflow_prd
      can_manage_run_group: dp_workflow_manage_run_prd
      can_manage_group: dp_workflow_manage_prd      
      subscription: 480FBAA2-345F-4572-8D98-C355469CE691
      databricks_secret_scope: kv-mx-data-adf-inges-preprd
      powerbi_refresh_azure_key_vault: kv-mx-data-adf-inges-preprd
      powerbi_refresh_client_id: ""
      powerbi_refresh_secret_name: ""
      powerbi_refresh_tenant_name: 0b0b76ba-8e32-4c41-8130-65ed5ca4353c
      powerbi_refresh_modules: ""
      service_principal_name: aeace192-2874-4f02-adac-c4ffca6ecaf9
      master_wf_pause_status: PAUSED
    run_as:
      service_principal_name: aeace192-2874-4f02-adac-c4ffca6ecaf9

  prd:
    mode: production
    workspace:
      host: https://adb-1645531006591813.13.azuredatabricks.net/
    variables:
      environment: ${bundle.target}
      can_view_group: dp_workflow_prd
      can_manage_run_group: dp_workflow_manage_run_prd
      can_manage_group: dp_workflow_manage_prd      
      subscription: 480FBAA2-345F-4572-8D98-C355469CE691
      databricks_secret_scope: kv-mx-data-adf-inges-prd
      powerbi_refresh_azure_key_vault: kv-mx-data-adf-inges-prd
      powerbi_refresh_client_id: acda2180-d99f-4f36-88ce-040867aee6f8
      powerbi_refresh_secret_name: sp-mx-data-powerbi-adb-trans-prd-01-client-secret
      powerbi_refresh_tenant_name: 0b0b76ba-8e32-4c41-8130-65ed5ca4353c
      powerbi_refresh_modules: ""
      service_principal_name: 24211de7-3c5f-46d8-a5a0-97ecbc80eaa9
      master_wf_pause_status: UNPAUSED
    run_as:
      service_principal_name: 24211de7-3c5f-46d8-a5a0-97ecbc80eaa9