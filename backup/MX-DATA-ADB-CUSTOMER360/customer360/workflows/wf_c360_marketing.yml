resources:
  jobs:
    wf_c360_marketing:
      name: wf_c360_marketing
      permissions:
      - group_name: ${var.can_manage_run_group}
        level: CAN_MANAGE_RUN
      tasks:
        - task_key: send_etl_start_notification
          notebook_task:
            notebook_path: ../shared_code/logging/etl_job_alerts.py
            base_parameters:
              job_run_id: "{{job.run_id}}"
              alert_type: start
            source: WORKSPACE
        - task_key: check_dependencies
          depends_on:
            - task_key: send_etl_start_notification
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../notebooks/orchestration/check_dependencies.py
            base_parameters:
              tables: ""
              is_check_required: no
              buffer_days: ""
            source: WORKSPACE
        - task_key: plt_marketing
          depends_on:
            - task_key: check_dependencies
          notebook_task:
            notebook_path: ../notebooks/platinum/plt_marketing.py
            base_parameters:
              current_job_run_id: "{{job.run_id}}"
            source: WORKSPACE
        - task_key: plt_marketing_dqc_check
          depends_on:
            - task_key: plt_marketing
          notebook_task:
            notebook_path: ../shared_code/dqc/dqc_checks.py
            base_parameters:
              layer: plt
              tablename: marketing
              task_run_id: "{{task.run_id}}"
            source: WORKSPACE
        - task_key: job_status_logging
          depends_on:
            - task_key: plt_marketing_dqc_check
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../shared_code/logging/get_all_job_details.py
            base_parameters:
              job_config: '{ "master_job": { "job_name": "wf_c360_marketing", "tag": "customer360" }, "job_names": []}'
            source: WORKSPACE
        - task_key: failure_teams_notification
          depends_on:
            - task_key: job_status_logging
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../shared_code/logging/etl_job_alerts.py
            base_parameters:
              job_run_id: "{{job.run_id}}"
              alert_type: failure
            source: WORKSPACE
        - task_key: update_failure_tag
          depends_on:
            - task_key: plt_marketing
          run_if: ALL_FAILED
          notebook_task:
            notebook_path: ../notebooks/orchestration/update_tag_workflow.py
            base_parameters:
              table_name: marketing
              is_failed: y
            source: WORKSPACE
      tags:
        use_case: customer360
      queue:
        enabled: true
      parameters:
        - name: buffer_days
          default: "7"
        - name: end_date
          default: ""
        - name: env
          default: ${var.environment}
        - name: start_date
          default: ""
        - name: usecase
          default: customer360
      run_as:
        service_principal_name: ${var.service_principal_name}