resources:
  jobs:
    wf_c360_kpi_refresh:
      name: wf_c360_kpi_refresh
      permissions:
      - group_name: ${var.can_manage_run_group}
        level: CAN_MANAGE_RUN
      tasks:
        - task_key: send_etl_start_notification
          notebook_task:
            notebook_path: ../shared_code/logging/etl_job_alerts.py
            base_parameters:
              job_run_id: "{{job.run_id}}"
              alert_type: start
            source: WORKSPACE
        - task_key: check_dependencies
          depends_on:
            - task_key: send_etl_start_notification
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../notebooks/orchestration/check_dependencies.py
            base_parameters:
              tables: ""
              is_check_required: no
              buffer_days: ""
            source: WORKSPACE
        - task_key: plt_kpi_snapshots_asset
          depends_on:
            - task_key: check_dependencies
          notebook_task:
            notebook_path: ../notebooks/platinum/c360_kpis/plt_kpi_snapshots.py
            base_parameters:
              current_job_run_id: "{{job.run_id}}"
              kpi_level: asset
            source: WORKSPACE
        - task_key: plt_kpi_snapshots_customer_email_id
          depends_on:
            - task_key: check_dependencies
          notebook_task:
            notebook_path: ../notebooks/platinum/c360_kpis/plt_kpi_snapshots.py
            base_parameters:
              current_job_run_id: "{{job.run_id}}"
              kpi_level: customer
              identifier_type: email_id
            source: WORKSPACE
        - task_key: plt_kpi_snapshots_customer_omni_sk
          depends_on:
            - task_key: check_dependencies
          notebook_task:
            notebook_path: ../notebooks/platinum/c360_kpis/plt_kpi_snapshots.py
            base_parameters:
              current_job_run_id: "{{job.run_id}}"
              kpi_level: customer
              identifier_type: omni_sk
            source: WORKSPACE
        - task_key: customer_kpi_view_creation
          depends_on:
            - task_key: plt_kpi_snapshots_customer_email_id
            - task_key: plt_kpi_snapshots_customer_omni_sk
          notebook_task:
            notebook_path: ../notebooks/platinum/view_creation.py
            base_parameters:
              object_name: vw_customer_kpi_by_scv_sk,tbvw_customer_kpi_by_omni_sk,tbvw_customer_kpi_by_email,tbvw_customer_kpi_by_email_o2o
              table_name: customer_kpi
            source: WORKSPACE
        - task_key: plt_kpi_snapshots_group
          depends_on:
            - task_key: plt_kpi_snapshots_customer_email_id
            - task_key: plt_kpi_snapshots_customer_omni_sk
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../notebooks/platinum/c360_kpis/plt_kpi_snapshots.py
            base_parameters:
              current_job_run_id: "{{job.run_id}}"
              kpi_level: group
            source: WORKSPACE
        - task_key: job_status_logging
          depends_on:
            - task_key: plt_kpi_snapshots_asset
            - task_key: plt_kpi_snapshots_group
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../shared_code/logging/get_all_job_details.py
            base_parameters:
              job_config: '{    "master_job": {        "job_name":
                "wf_c360_kpi_refresh",        "tag": "customer360"    },
                "job_names": []}'
            source: WORKSPACE
        - task_key: failure_teams_notification
          depends_on:
            - task_key: job_status_logging
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../shared_code/logging/etl_job_alerts.py
            base_parameters:
              job_run_id: "{{job.run_id}}"
              alert_type: failure
            source: WORKSPACE
        - task_key: update_failure_tag_asset_kpi
          depends_on:
            - task_key: plt_kpi_snapshots_asset
          run_if: ALL_FAILED
          notebook_task:
            notebook_path: ../notebooks/orchestration/update_tag_workflow.py
            base_parameters:
              table_name: readiness_asset_kpi
              is_failed: y
            source: WORKSPACE
        - task_key: update_failure_tag_customer_kpi_email_id
          depends_on:
            - task_key: plt_kpi_snapshots_customer_email_id
          run_if: ALL_FAILED
          notebook_task:
            notebook_path: ../notebooks/orchestration/update_tag_workflow.py
            base_parameters:
              table_name: readiness_customer_kpi_email_id
              is_failed: y
            source: WORKSPACE
        - task_key: update_failure_tag_customer_kpi_omni_sk
          depends_on:
            - task_key: plt_kpi_snapshots_customer_omni_sk
          run_if: ALL_FAILED
          notebook_task:
            notebook_path: ../notebooks/orchestration/update_tag_workflow.py
            base_parameters:
              table_name: readiness_customer_kpi_omni_sk
              is_failed: y
            source: WORKSPACE
        - task_key: update_failure_tag_group_kpi
          depends_on:
            - task_key: plt_kpi_snapshots_group
          run_if: ALL_FAILED
          notebook_task:
            notebook_path: ../notebooks/orchestration/update_tag_workflow.py
            base_parameters:
              table_name: readiness_group_kpi
              is_failed: y
            source: WORKSPACE
      tags:
        use_case: customer360
      queue:
        enabled: true
      parameters:
        - name: env
          default: ${var.environment}
        - name: report_date
          default: ""
        - name: usecase
          default: customer360
      run_as:
        service_principal_name: ${var.service_principal_name}