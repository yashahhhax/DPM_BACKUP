resources:
  jobs:
    wf_c360_complaints_refunds:
      name: wf_c360_complaints_refunds
      permissions:
        - group_name: ${var.can_manage_run_group}
          level: CAN_MANAGE_RUN
      tasks:
        - task_key: send_etl_start_notification
          notebook_task:
            notebook_path: ../shared_code/logging/etl_job_alerts.py
            base_parameters:
              job_run_id: "{{job.run_id}}"
              alert_type: start
            source: WORKSPACE
        - task_key: check_dependencies
          depends_on:
            - task_key: send_etl_start_notification
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../notebooks/orchestration/check_dependencies.py
            base_parameters:
              is_check_required: no
              tables: ""
              tag_buffer_days: ""
            source: WORKSPACE
        - task_key: plt_complaints_refund
          depends_on:
            - task_key: check_dependencies
          notebook_task:
            notebook_path: ../notebooks/platinum/plt_complaints_refunds.py
            base_parameters:
              current_job_run_id: "{{job.run_id}}"
            source: WORKSPACE
        - task_key: plt_complaints_refund_dqc_check_refund
          depends_on:
            - task_key: plt_complaints_refund
          notebook_task:
            notebook_path: ../shared_code/dqc/dqc_checks.py
            base_parameters:
              layer: plt
              tablename: customer_survey
              task_run_id: "{{task.run_id}}"
            source: WORKSPACE
        - task_key: plt_crm_account_contacts_rfp
          depends_on:
            - task_key: check_dependencies
          notebook_task:
            notebook_path: ../notebooks/platinum/plt_crm_account_contacts_rfp.py
            base_parameters:
              current_job_run_id: "{{job.run_id}}"
            source: WORKSPACE
        - task_key: plt_crm_account_contacts_rfp_dqc_check_rfp
          depends_on:
            - task_key: plt_crm_account_contacts_rfp
          notebook_task:
            notebook_path: ../shared_code/dqc/dqc_checks.py
            base_parameters:
              layer: plt
              tablename: crm_account_contacts_rfp
              task_run_id: "{{task.run_id}}"
            source: WORKSPACE
        - task_key: job_status_logging_refund
          depends_on:
            - task_key: plt_complaints_refund_dqc_check_refund
            - task_key: plt_crm_account_contacts_rfp_dqc_check_rfp
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../shared_code/logging/get_all_job_details.py
            base_parameters:
              job_config: '{ "master_job": { "job_name": "wf_c360_complaints_refunds", "tag":
                "customer360" }, "job_names": [] }'
            source: WORKSPACE
        - task_key: failure_teams_notification_refund
          depends_on:
            - task_key: job_status_logging_refund
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../shared_code/logging/etl_job_alerts.py
            base_parameters:
              job_run_id: "{{job.run_id}}"
              alert_type: failure
            source: WORKSPACE
        - task_key: update_failure_tag
          depends_on:
            - task_key: plt_complaints_refund
          run_if: ALL_FAILED
          notebook_task:
            notebook_path: ../shared_code/dqc/dqc_checks.py
            base_parameters:
              layer: plt
              tablename: crm_account_contacts_rfp
              task_run_id: "{{task.run_id}}"
            source: WORKSPACE
        - task_key: update_failure_tag_rfp
          depends_on:
            - task_key: plt_crm_account_contacts_rfp
          run_if: ALL_FAILED
          notebook_task:
            notebook_path: ../shared_code/dqc/dqc_checks.py
            base_parameters:
              layer: plt
              tablename: crm_account_contacts_rfp
              task_run_id: "{{task.run_id}}"
            source: WORKSPACE
      tags:
        use_case: customer360
      queue:
        enabled: true
      parameters:
        - name: buffer_days
          default: "30"
        - name: env
          default: ${var.environment}
        - name: usecase
          default: customer360
      run_as:
          service_principal_name: ${var.service_principal_name} 
