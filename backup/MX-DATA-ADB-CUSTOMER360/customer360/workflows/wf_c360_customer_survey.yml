resources:
  jobs:
    wf_c360_customer_survey:
      name: wf_c360_customer_survey
      permissions:
        - group_name: ${var.can_manage_run_group}
          level: CAN_MANAGE_RUN
      tasks:
        - task_key: send_etl_start_notification
          notebook_task:
            notebook_path: ../shared_code/logging/etl_job_alerts.py
            base_parameters:
              job_run_id: "{{job.run_id}}"
              alert_type: start
            source: WORKSPACE
        - task_key: check_dependencies
          depends_on:
            - task_key: send_etl_start_notification
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../notebooks/orchestration/check_dependencies.py
            base_parameters:
              is_check_required: no
              tables: ""
              tag_buffer_days: ""
            source: WORKSPACE
        - task_key: plt_customer_survey
          depends_on:
            - task_key: check_dependencies
          notebook_task:
            notebook_path: ../notebooks/platinum/plt_customer_survey.py
            source: WORKSPACE
        - task_key: plt_customer_survey_dqc_c
          depends_on:
            - task_key: plt_customer_survey
          notebook_task:
            notebook_path: ../shared_code/dqc/dqc_checks.py
            base_parameters:
              layer: plt
              tablename: customer_survey
              task_run_id: "{{task.run_id}}"
            source: WORKSPACE
        - task_key: job_status_logging
          depends_on:
            - task_key: plt_customer_survey_dqc_c
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../shared_code/logging/get_all_job_details.py
            base_parameters:
              job_config: '	{ "master_job": { "job_name": "wf_c360_customer_survey", "tag":
                "customer360" }, "job_names": []}'
            source: WORKSPACE
        - task_key: failure_teams_notification
          depends_on:
            - task_key: job_status_logging
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../shared_code/logging/etl_job_alerts.py
            base_parameters:
              job_run_id: "{{job.run_id}}"
              alert_type: failure
            source: WORKSPACE
        - task_key: update_failure_tag
          depends_on:
            - task_key: plt_customer_survey
          run_if: ALL_FAILED
          notebook_task:
            notebook_path: ../notebooks/orchestration/update_tag_workflow.py
            base_parameters:
              table_name: customer_survey
              is_failed: y
            source: WORKSPACE
      tags:
        use_case: customer360
      queue:
        enabled: true
      parameters:
        - name: buffer_days
          default: "7"
        - name: start_date
          default: ""
        - name: end_date
          default: ""
        - name: env
          default: ${var.environment}
        - name: usecase
          default: customer360
      run_as:
          service_principal_name: ${var.service_principal_name}
