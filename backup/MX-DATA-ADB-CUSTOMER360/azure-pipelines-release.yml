name: Deploy tagged release to preprod and prod

resources:
  repositories:
    - repository: templateRepo
      type: git
      name: MX-DATA-DEVOPS-TEMPLATES
      ref: refs/heads/main
    - repository: sharedRepo
      type: git
      name: MX-DATA-ADB 
      ref: 'refs/heads/main'                  

pr:
  autoCancel: false

trigger:
  tags:
    include:
    - '*'

stages:
# Pre-Prod
- template: asset_bundle.yml@templateRepo
  parameters:
    name: "Transformation_PreProd"
    service_connection: 'sp-mx-data-cicd-preprd-01'
    agent_pool_name: 'data-platform-preprd'
    environment: 'preprd'
    folder_name: 'customer360'
    job_to_run: 'wf_workflow_orchestration_config_customer360'

- template: asset_bundle.yml@templateRepo
  parameters:
    name: "Ingestion_PreProd"
    service_connection: 'sp-mx-data-cicd-preprd-01'
    agent_pool_name: 'data-platform-preprd'
    environment: 'preprd'
    folder_name: 'customer360/ingestion'

# Prod
- template: asset_bundle.yml@templateRepo
  parameters:
    name: "Transformation_Prod"
    service_connection: 'sp-mx-data-cicd-prd-01'
    agent_pool_name: 'data-platform-prd'
    environment: 'prd'
    folder_name: 'customer360'
    dependsOn: ['Transformation_PreProd']
    job_to_run: 'wf_workflow_orchestration_config_customer360'

- template: asset_bundle.yml@templateRepo
  parameters:
    name: "Ingestion_Prod"
    service_connection: 'sp-mx-data-cicd-prd-01'
    agent_pool_name: 'data-platform-prd'
    environment: 'prd'
    folder_name: 'customer360/ingestion'
    dependsOn: ['Ingestion_PreProd']
