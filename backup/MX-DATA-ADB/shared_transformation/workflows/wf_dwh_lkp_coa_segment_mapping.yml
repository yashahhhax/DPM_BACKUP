resources:
  jobs:
    wf_dwh_lkp_coa_segment_mapping:
      name: wf_dwh_lkp_coa_segment_mapping
      permissions:
        - group_name: ${var.can_manage_run_group}
          level: CAN_MANAGE_RUN
      tasks:
        - task_key: slv_coa_segment_mapping
          notebook_task:
            notebook_path: ../notebooks/silver/slv_lkp_coa_segment_mapping.py
            source: WORKSPACE
          
        - task_key: gld_coa_segment_mapping
          depends_on:
            - task_key: slv_coa_segment_mapping
          timeout_seconds: 2700
          max_retries: 1
          min_retry_interval_millis: 60000
          retry_on_timeout: true
          notebook_task:
            notebook_path: ../notebooks/gold/gld_lkp_coa_segment_mapping.py
            base_parameters:
              current_job_run_id: "{{job.run_id}}"
            source: WORKSPACE
          
        - task_key: failure_teams_notification
          depends_on:
            - task_key: updatetag_run_orch_workflow
          run_if: ALL_DONE
          timeout_seconds: 2700
          max_retries: 1
          min_retry_interval_millis: 60000
          retry_on_timeout: true
          notebook_task:
            notebook_path: ../shared_code/logging/etl_job_alerts.py
            base_parameters:
              alert_type: failure
              job_run_id: "{{job.run_id}}"
            source: WORKSPACE
          
        - task_key: updatetag_run_orch_workflow
          depends_on:
            - task_key: gld_coa_segment_mapping
          max_retries: 1
          min_retry_interval_millis: 60000
          retry_on_timeout: true
          notebook_task:
            notebook_path: ../notebooks/gold/update_tag_workflow.py
            base_parameters:
              table_name: dwh_lkp_coa_segment_mapping
            source: WORKSPACE
          
      tags:
        use_case: shared_ea_drr,shared_oracle_gl
      queue:
        enabled: true
      parameters:
        - name: env
          default: ${var.environment}
        - name: usecase
          default: shared